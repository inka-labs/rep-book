      <p class="note" style="margin:0">Their logged sessions still count in your calendars and progress.</p></div>`:""}
    <p class="note">Renaming an exercise renames it everywhere, including sessions you've already logged. Removing one from a workout keeps its history. Set the days each workout is planned for in Targets.</p>
    <datalist id="exCatalogW">${Object.values(plan.exercises).sort((a,b)=>a.n.localeCompare(b.n)).map(e=>`<option value="${esc(e.n)}"></option>`).join("")}</datalist>`;
}
const wt=$("#p-workouts");
wt.addEventListener("input",e=>{
  const t=e.target,card=t.closest("[data-w]");if(!card||!S.settings.plan)return;
  const w=planW(card.dataset.w),v=t.value;
  if(t.dataset.wf){if(t.dataset.wf==="short"&&!v.trim())return;w[t.dataset.wf]=v}
  else if(t.dataset.xf==="n"){if(!v.trim())return;S.settings.plan.exercises[t.dataset.x].n=v}
  else if(t.dataset.pf==="s"){const n=Math.round(numOrNull(v));if(!(n>=1&&n<=20))return;w.ex[+t.dataset.i].s=n}
  else if(t.dataset.pf==="r")w.ex[+t.dataset.i].r=v;
  else return;
  savePlan();
});
wt.addEventListener("change",e=>{
  const t=e.target;if(t.dataset.xf!=="k")return;
  S.settings.plan.exercises[t.dataset.x].k=t.value;savePlan();
});
wt.addEventListener("click",e=>{
  const b=e.target.closest("button[data-act]");if(!b||!S.settings.plan)return;
  const act=b.dataset.act,plan=S.settings.plan,card=b.closest(".wcard"),w=card?planW(card.dataset.w):null;
  if(act==="w-new"){
    const used=new Set(plan.workouts.filter(x=>!x.archived).map(x=>x.color));
    const color=COLORS.find(c=>!used.has(c))||COLORS[plan.workouts.length%COLORS.length];
    const id="w"+Date.now().toString(36);
    plan.workouts.push({id,short:"New workout",name:"",color,archived:false,ex:[]});
    savePlan();renderWorkouts();const inp=$(`#ws-${id}`);inp.focus();inp.select();return;
  }
  if(act==="w-restore"){planW(b.dataset.w).archived=false;savePlan();renderWorkouts();return}
  if(!w)return;
  if(act==="w-color"){w.color=b.dataset.c}
  else if(act==="w-remove"){WT.confirm=w.id;renderWorkouts();return}
  else if(act==="w-cancel"){WT.confirm=null;renderWorkouts();return}
  else if(act==="w-remove-yes"){
    w.archived=true;WT.confirm=null;
    for(const[k,v]of Object.entries(S.settings.schedule))if(v===w.id)delete S.settings.schedule[k];
  }
  else if(act==="x-up"||act==="x-down"){const i=+b.dataset.i,j=act==="x-up"?i-1:i+1;if(j<0||j>=w.ex.length)return;[w.ex[i],w.ex[j]]=[w.ex[j],w.ex[i]]}
  else if(act==="x-remove"){w.ex.splice(+b.dataset.i,1)}
  else return;
  savePlan();renderWorkouts();
  if(act==="x-up"||act==="x-down")wt.querySelector(`.wcard[data-w="${w.id}"] [data-act="${act}"][data-i="${act==="x-up"?+b.dataset.i-1:+b.dataset.i+1}"]`)?.focus();
});
wt.addEventListener("submit",e=>{
  const f=e.target.closest("form[data-addto]");if(!f)return;e.preventDefault();
  const name=f.elements.n.value.trim();if(!name){f.elements.n.focus();return}
  const w=planW(f.dataset.addto),id=exerciseFor(name,f.elements.k.value);
  if(!w.ex.some(x=>x.id===id))w.ex.push({id,s:3,r:defaultReps(S.settings.plan.exercises[id].k)});
  savePlan();renderWorkouts();
  wt.querySelector(`form[data-addto="${w.id}"] input[name=n]`)?.focus();
});

/* ---------- meals: goal, weekly prep plan, shopping list ---------- */
const GOALS={
  cut:{name:"Lose weight",short:"Cut",factor:.8,protein:2.2,desc:"About 20% under maintenance, with high protein to keep your muscle."},
  maintain:{name:"Maintain",short:"Maintain",factor:1,protein:2.0,desc:"Maintenance calories and high protein: slowly lose fat and gain muscle."},
  bulk:{name:"Build muscle",short:"Bulk",factor:1.1,protein:1.8,desc:"About 10% over maintenance, to gain mostly muscle rather than fat."}};
// [slot, label, share of the day's calories, which recipes fit]
const SLOTS=[["breakfast","Breakfast",.25,"breakfast"],["lunch","Lunch",.35,"main"],["dinner","Dinner",.30,"main"],["snack","Snack",.10,"snack"]];
const CATS=[["protein","Protein"],["legumes","Beans & lentils"],["grains","Grains & flour"],["veg","Vegetables"],["fruit","Fruit"],["dairy","Dairy"],["pantry","Pantry"]];
const KCAL_PER_KG=33; // rough maintenance for an active adult training 4 times a week
const nut=()=>({goal:"maintain",budget:false,weeklyBudget:null,maintenance:null,prices:{},...(S.settings.nutrition||{})});
const ksh=v=>"KES "+Math.round(v).toLocaleString("en-GB");
function currentWeight(){const bw=bwSeries();return bw.length?bw[bw.length-1].y:(S.settings.startWeight??null)}
function targets(){
  const n=nut(),w=currentWeight();
  if(w==null&&n.maintenance==null)return null;
  const maint=n.maintenance??Math.round(w*KCAL_PER_KG/10)*10,g=GOALS[n.goal]||GOALS.maintain;
  const kcal=Math.round(maint*g.factor/10)*10;
  return{maint,kcal,protein:w!=null?Math.round(w*g.protein):Math.round(kcal*.25/4),weight:w,estimated:n.maintenance==null};
}
function weeklyRate(){ // kg per week over the last ~2 weeks of weigh-ins
  const bw=bwSeries();if(bw.length<2)return null;
  const last=bw[bw.length-1],from=bw.filter(p=>p.x>=last.x-15*864e5)[0];
  if(!from||from===last||last.x-from.x<6*864e5)return null;
  return(last.y-from.y)/((last.x-from.x)/(7*864e5));
}
const ING=id=>S.food?.ingredients?.[id];
const priceOf=id=>nut().prices[id]??ING(id)?.price??0;
const perN=(i,a)=>i.unit==="pc"?a:a/100;      // nutrition is per 100 g / 100 ml / piece
const perC=(i,a)=>i.unit==="pc"?a:a/1000;     // price is per kg / L / piece
const RECIPE=id=>S.food?.recipes?.find(r=>r.id===id);
function recipeStats(r){let kcal=0,p=0,cost=0;for(const[id,a]of r.ing){const i=ING(id);if(!i)continue;kcal+=i.kcal*perN(i,a);p+=i.p*perN(i,a);cost+=priceOf(id)*perC(i,a)}return{kcal,p,cost}}
function fitScore(r){
  const st=recipeStats(r),n=nut(),pf=st.p*4/st.kcal; // share of calories from protein
  let sc=n.goal==="cut"?pf*3-st.kcal/1500:n.goal==="bulk"?pf*1.5+st.kcal/1200:pf*2.2;
  // Budget: for a bulk, what matters is cheap calories (KES per 100 kcal); otherwise cheap protein (KES per 10 g)
  if(n.budget)sc-=n.goal==="bulk"?st.cost/st.kcal*100/25:st.cost/st.p*10/40;
  return sc;
}
const recipesFor=kind=>(S.food?.recipes||[]).filter(r=>r.slot===kind).sort((a,b)=>fitScore(b)-fitScore(a));
const mealWeek=()=>S.mealWeek||(S.mealWeek=iso(weekStart(new Date())));
const weekPlan=()=>S.meals?.[mealWeek()]||null;
function ensureWeekPlan(){const w=mealWeek();if(!S.meals[w])S.meals[w]={slots:{breakfast:null,lunch:null,dinner:null,snack:null},days:7,checked:[]};return S.meals[w]}
// Portions per day for each filled slot: the ones you set, or sized so the day adds up to your calorie target
function portionsFor(plan){
  const tg=targets(),filled=SLOTS.filter(([k])=>plan.slots[k]&&RECIPE(plan.slots[k].recipe));
  const share=filled.reduce((a,[,, sh])=>a+sh,0)||1,out={};
  for(const[k,, sh]of filled){
    const sl=plan.slots[k],st=recipeStats(RECIPE(sl.recipe));
    if(sl.portions!=null){out[k]={n:sl.portions,auto:false};continue}
    const want=tg?tg.kcal*sh/share/st.kcal:1;
    out[k]={n:Math.min(3,Math.max(.5,Math.round(want*4)/4)),auto:true};
  }
  return out;
}
function dayTotals(plan){
  const por=portionsFor(plan);let kcal=0,p=0,cost=0;
  for(const[k,v]of Object.entries(por)){const st=recipeStats(RECIPE(plan.slots[k].recipe));kcal+=st.kcal*v.n;p+=st.p*v.n;cost+=st.cost*v.n}
  return{kcal,p,cost,por};
}
function suggestWeek(){
  const plan=ensureWeekPlan(),mains=recipesFor("main");
  plan.slots.breakfast={recipe:recipesFor("breakfast")[0]?.id,portions:null};
  plan.slots.lunch={recipe:mains[0]?.id,portions:null};
  plan.slots.dinner={recipe:mains[1]?.id,portions:null};
  plan.slots.snack={recipe:recipesFor("snack")[0]?.id,portions:null};
  plan.checked=[];
}
function shoppingList(plan){
  const por=portionsFor(plan),items={};
  for(const[k,v]of Object.entries(por))for(const[id,a]of RECIPE(plan.slots[k].recipe).ing)items[id]=(items[id]||0)+a*v.n*plan.days;
  return Object.entries(items).map(([id,amt])=>{const i=ING(id);const q=i.unit==="pc"?Math.ceil(amt):amt;return{id,i,amt:q,cost:priceOf(id)*perC(i,q)}});
}
function qty(i,a){
  if(i.unit==="pc")return`${a} ${a===1?"piece":"pieces"}`;
  const big=i.unit==="g"?"kg":"L",small=i.unit;
  return a>=1000?`${fmtN(a/1000,2)} ${big}`:`${Math.round(a/10)*10} ${small}`;
}
const unitLabel=i=>i.unit==="pc"?"each":i.unit==="g"?"per kg":"per L";
function meter(v,t){const pct=t?Math.min(100,v/t*100):0;return`<div class="bar-mini" style="flex:1"><i style="width:${pct}%"></i></div>`}

function renderMeals(){
  const el=$("#p-meals");
  if(!S.food){el.innerHTML=`<p class="note">Loading…</p>`;return}
  // Redraw only the parts that aren't being typed in, so focus and caret stay put
  const parts={goal:mealsGoal,plan:mealsPlan,prep:mealsPrep,shop:mealsShop,prices:mealsPrices};
  if(!$("#m-goal",el)){
    el.innerHTML=`<div class="log-head"><div><h2>Meals</h2><div class="muted">Meal prep for your goal: pick it, plan the week, cook once, shop from one list.</div></div></div>
      <div class="card" id="m-goal"></div><div class="card" id="m-plan"></div>
      <div class="charts"><div class="card" id="m-prep"></div><div class="card" id="m-shop"></div></div>
      <details class="card" id="m-prices"></details>`;
  }
  for(const[k,f]of Object.entries(parts)){const box=$("#m-"+k,el);if(!box.contains(document.activeElement)||document.activeElement.type==="checkbox"||document.activeElement.tagName==="BUTTON")box.innerHTML=f()}
}
function mealsGoal(){
  const n=nut(),tg=targets(),rate=weeklyRate();
  let trend="";
  if(rate!=null){
    const ok=n.goal==="cut"?rate<=-0.2:n.goal==="bulk"?rate>=0.1&&rate<=0.5:Math.abs(rate)<=0.2;
    const tip=ok?"on track":n.goal==="cut"?"not dropping yet: lower the maintenance figure by 100–200 kcal":n.goal==="bulk"?(rate>0.5?"gaining fast: raise less, or lower maintenance by 100 kcal":"not gaining yet: raise the maintenance figure by 100–200 kcal"):"drifting: adjust maintenance by 100 kcal";
    trend=`<p class="note" style="margin:0">Your weight over the last 2 weeks: <span class="num">${rate>0?"+":rate<0?"−":""}${fmtN(Math.abs(rate),2)} kg/week</span>, <span class="${ok?"ok-t":"warn-t"}">${tip}</span>.</p>`;
  }
  return `<div class="card-head" style="margin:0"><h3>Your goal</h3></div>
    <div class="goals" role="group" aria-label="Goal">${Object.entries(GOALS).map(([k,g])=>`<button type="button" class="goal" data-goal="${k}" aria-pressed="${n.goal===k}"><b>${g.name}</b><span>${g.desc}</span></button>`).join("")}</div>
    <div class="row" style="gap:14px">
      <label class="chkline" style="color:var(--ink);font-weight:600"><input type="checkbox" id="nBudget" ${n.budget?"checked":""}> On a budget</label>
      ${n.budget?`<label class="row" style="gap:6px" for="nWeekly"><span class="note">Weekly food budget</span><input class="inp num" id="nWeekly" inputmode="numeric" style="width:110px" value="${n.weeklyBudget??""}" placeholder="KES"></label>`:`<span class="note">Favours cheap staples like omena, ndengu, githeri and soya, and shows what the week costs.</span>`}
    </div>
    <div class="tgt">
      ${tg?`<div class="stat"><div class="v num-d">${tg.kcal.toLocaleString("en-GB")}<span class="muted" style="font-size:15px"> kcal</span></div><div class="k">a day</div></div>
        <div class="stat"><div class="v">${tg.protein}<span class="muted" style="font-size:15px"> g</span></div><div class="k">protein a day</div></div>`
        :`<div class="empty" style="flex:1">Log your body weight in the daily log (or set a starting weight in Targets) to get calorie and protein targets.</div>`}
      <div class="field" style="min-width:200px;flex:1"><label for="nMaint">Maintenance calories</label>
        <input class="inp num" id="nMaint" inputmode="numeric" value="${n.maintenance??""}" placeholder="${tg?`${tg.maint} (estimated)`:"e.g. 2600"}">
        <span class="note">${tg&&tg.estimated?`Estimated as ${KCAL_PER_KG} kcal × ${fmtN(tg.weight)} kg. Type your own if you know it.`:"Clear it to go back to the estimate."}</span></div>
    </div>
    ${trend}`;
}
function mealsPlan(){
  const w=mealWeek(),plan=weekPlan(),tg=targets(),n=nut(),end=addDays(parse(w),6);
  const isThis=w===iso(weekStart(new Date()));
  const head=`<div class="card-head"><div class="weeknav"><button class="icon-btn" data-act="m-prev" aria-label="Previous week">‹</button>
      <div><h3>Prep plan</h3><div class="muted">${parse(w).toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${end.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}${isThis?" · this week":""}</div></div>
      <button class="icon-btn" data-act="m-next" aria-label="Next week">›</button></div>
    <div class="row">${plan?`<label class="row" style="gap:6px"><span class="note">Cooking for</span><select class="inp" id="mDays" style="width:auto">${[3,4,5,6,7].map(d=>`<option value="${d}" ${plan.days===d?"selected":""}>${d} days</option>`).join("")}</select></label>`:""}
      <button class="btn" data-act="m-suggest">${plan?"Re-suggest for my goal":`Suggest a week for ${GOALS[n.goal].name.toLowerCase()}`}</button></div></div>`;
  if(!plan)return head+`<div class="empty">No prep plan for this week yet. Suggest one for your goal${n.budget?" and budget":""}, then swap any meal you don't fancy.</div>`;
  const t=dayTotals(plan);
  const rows=SLOTS.map(([k,label,,kind])=>{
    const sl=plan.slots[k],r=sl&&RECIPE(sl.recipe),list=recipesFor(kind),po=t.por[k];
    const st=r?recipeStats(r):null;
    return `<div class="mrow">
      <span class="flabel">${label}</span>
      <select class="inp" data-slot="${k}" aria-label="${label}"><option value="">${k==="snack"?"No snack":"Nothing planned"}</option>${list.map((x,i)=>`<option value="${x.id}" ${sl?.recipe===x.id?"selected":""}>${esc(x.n)}${i===0?" ★ best fit":""}</option>`).join("")}</select>
      ${r?`<span class="por"><button type="button" class="icon-btn sm" data-act="m-less" data-slot="${k}" aria-label="Fewer portions">−</button><span class="num">${fmtN(po.n,2)}</span><button type="button" class="icon-btn sm" data-act="m-more" data-slot="${k}" aria-label="More portions">+</button>
          ${po.auto?`<span class="tag" title="Sized to your calorie target">auto</span>`:`<button type="button" class="linkbtn" data-act="m-auto" data-slot="${k}">auto</button>`}</span>
        <span class="mstats num">${Math.round(st.kcal*po.n)} kcal · ${Math.round(st.p*po.n)} g · ${ksh(st.cost*po.n)}</span>`:`<span></span><span></span>`}
    </div>`;}).join("");
  const short=tg?tg.protein-t.p:0,weekCost=t.cost*plan.days;
  const over=n.budget&&n.weeklyBudget?weekCost-n.weeklyBudget:null;
  return head+`<div class="mrows">${rows}</div>
    <div class="mtotals">
      <div class="mt"><span class="flabel">Calories a day</span><div class="row" style="flex-wrap:nowrap"><span class="num">${Math.round(t.kcal).toLocaleString("en-GB")}${tg?` / ${tg.kcal.toLocaleString("en-GB")}`:""}</span>${tg?meter(t.kcal,tg.kcal):""}</div></div>
      <div class="mt"><span class="flabel">Protein a day</span><div class="row" style="flex-wrap:nowrap"><span class="num">${Math.round(t.p)}${tg?` / ${tg.protein}`:""} g</span>${tg?meter(t.p,tg.protein):""}</div></div>
      <div class="mt"><span class="flabel">Cost</span><div><span class="num">${ksh(t.cost)}</span> a day · <b class="num">${ksh(weekCost)}</b> for ${plan.days} days
        ${over!=null?`<span class="state ${over>0?"missed":"done"}" style="display:inline-flex;margin-left:6px">${over>0?`${ksh(over)} over budget`:`${ksh(-over)} under budget`}</span>`:""}</div></div>
    </div>
    ${tg&&short>8?`<p class="note warn-t" style="margin:6px 0 0">${Math.round(short)} g short on protein a day. Three boiled eggs or a shake as the snack, or omena or soya for a main, closes most of it.</p>`:""}
    ${tg&&t.kcal<tg.kcal*.9?`<p class="note" style="margin:6px 0 0">Under your calorie target: add a portion with + or pick a snack.</p>`:""}`;
}
function mealsPrep(){
  const plan=weekPlan();
  if(!plan)return`<h3>Prep day</h3><p class="note">What to cook appears here once the week has a plan.</p>`;
  const por=portionsFor(plan),by={};
  for(const[k,v]of Object.entries(por)){const id=plan.slots[k].recipe;by[id]=(by[id]||0)+v.n*plan.days}
  const items=Object.entries(by);
  return `<div class="card-head"><h3>Prep day</h3><span class="muted">for ${plan.days} days</span></div>
    ${items.length?`<ol class="prep">${items.map(([id,total])=>{const r=RECIPE(id);return`<li><b>${esc(r.n)}</b> <span class="num muted">× ${fmtN(total,2)} portions</span><p class="note" style="margin:2px 0 0">${esc(r.how)}</p></li>`}).join("")}</ol>`:`<p class="note">Pick meals in the plan.</p>`}`;
}
function mealsShop(){
  const plan=weekPlan();
  if(!plan)return`<h3>Shopping list</h3><p class="note">Your list appears here once the week has a plan.</p>`;
  const list=shoppingList(plan),checked=new Set(plan.checked||[]);
  const total=list.reduce((a,x)=>a+x.cost,0),left=list.filter(x=>!checked.has(x.id)).reduce((a,x)=>a+x.cost,0);
  const groups=CATS.map(([c,label])=>{const xs=list.filter(x=>x.i.cat===c);if(!xs.length)return"";
    return`<div class="sgroup"><span class="flabel">${label}</span>${xs.map(x=>`<label class="sitem ${checked.has(x.id)?"got":""}"><input type="checkbox" data-shop="${x.id}" ${checked.has(x.id)?"checked":""}><span>${esc(x.i.n)}</span><span class="num muted">${qty(x.i,x.amt)}</span><span class="num">${ksh(x.cost)}</span></label>`).join("")}</div>`}).join("");
  return `<div class="card-head"><h3>Shopping list</h3><button type="button" class="btn ghost small" data-act="m-copy">Copy list</button></div>
    ${groups||`<p class="note">Pick meals in the plan.</p>`}
    <div class="row" style="justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:6px"><b>Total <span class="num">${ksh(total)}</span></b><span class="note">${checked.size?`${ksh(left)} still to buy`:"Tick items off as you shop"}</span></div>
    <p class="note" style="margin:6px 0 0">${esc(S.food.pricesNote)}</p>`;
}
function mealsPrices(){
  const n=nut();
  return `<summary><h3 style="display:inline">Prices</h3> <span class="muted">KES, estimates you can edit</span></summary>
    <p class="note">${esc(S.food.pricesNote)}</p>
    <div class="tgrid">${CATS.flatMap(([c])=>Object.entries(S.food.ingredients).filter(([,i])=>i.cat===c)).map(([id,i])=>`<div class="field"><label for="pr-${id}">${esc(i.n)} <span class="muted" style="text-transform:none;letter-spacing:0">${unitLabel(i)}</span></label><input class="inp num" id="pr-${id}" data-price="${id}" inputmode="decimal" value="${n.prices[id]??""}" placeholder="${i.price}"></div>`).join("")}</div>`;
}
function saveNut(patch){S.settings.nutrition={...nut(),...patch};queue("settings");renderSummary();renderMeals()}
function saveWeek(){queue("meals:"+mealWeek());renderMeals()}
const pm=$("#p-meals");
pm.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.goal)return saveNut({goal:b.dataset.goal});
  const act=b.dataset.act,slot=b.dataset.slot;
  if(act==="m-prev"||act==="m-next"){S.mealWeek=iso(addDays(parse(mealWeek()),act==="m-prev"?-7:7));return renderMeals()}
  if(act==="m-suggest"){suggestWeek();return saveWeek()}
  if(act==="m-copy"){
    const plan=weekPlan(),checked=new Set(plan.checked||[]);
    const text=`Shopping for ${fd(mealWeek(),{day:"numeric",month:"short"})} (${plan.days} days)\n`+shoppingList(plan).filter(x=>!checked.has(x.id)).map(x=>`- ${x.i.n}: ${qty(x.i,x.amt)}`).join("\n");
    try{await navigator.clipboard.writeText(text);b.textContent="Copied"}catch(err){b.textContent="Couldn't copy"}
    setTimeout(()=>{b.textContent="Copy list"},1500);return;
  }
  const plan=weekPlan();if(!plan||!slot)return;
  const cur=portionsFor(plan)[slot];
  if(act==="m-more"||act==="m-less")plan.slots[slot].portions=Math.min(6,Math.max(.25,cur.n+(act==="m-more"?.25:-.25)));
  if(act==="m-auto")plan.slots[slot].portions=null;
  saveWeek();
});
pm.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="nBudget")return saveNut({budget:t.checked});
  if(t.id==="mDays"){ensureWeekPlan().days=+t.value;return saveWeek()}
  if(t.dataset.slot){const plan=ensureWeekPlan();plan.slots[t.dataset.slot]=t.value?{recipe:t.value,portions:null}:null;return saveWeek()}
  if(t.dataset.shop){const plan=weekPlan(),set=new Set(plan.checked||[]);t.checked?set.add(t.dataset.shop):set.delete(t.dataset.shop);plan.checked=[...set];
    t.closest(".sitem").classList.toggle("got",t.checked);queue("meals:"+mealWeek());$("#m-shop").innerHTML=mealsShop();return}
});
pm.addEventListener("input",e=>{
  const t=e.target,n=nut();
  if(t.id==="nWeekly"){S.settings.nutrition={...n,weeklyBudget:numOrNull(t.value)}}
  else if(t.id==="nMaint"){const v=numOrNull(t.value);if(v!=null&&(v<800||v>6000))return;S.settings.nutrition={...n,maintenance:v}}
  else if(t.dataset.price){const v=numOrNull(t.value),prices={...n.prices};if(v==null)delete prices[t.dataset.price];else prices[t.dataset.price]=v;S.settings.nutrition={...n,prices}}
  else return;
  queue("settings");renderSummary();renderMeals();
});
$("#summary").addEventListener("click",e=>{const b=e.target.closest("[data-goto]");if(b)setTab(b.dataset.goto)});

/* ---------- theme picker ---------- */
const themeNow=()=>({mode:"system",accent:"blue",...(S.settings.theme||{})});
function renderThemePanel(){
  const t=themeNow(),dark=t.mode==="dark"||(t.mode==="system"&&DARK_MQ.matches);
  $("#themePanel").innerHTML=`
    <span class="flabel">Mode</span>
    <div class="seg-mini" role="group" aria-label="Mode">${[["system","System"],["light","Light"],["dark","Dark"]].map(([k,n])=>`<button type="button" data-mode="${k}" aria-pressed="${t.mode===k}">${n}</button>`).join("")}</div>
    <span class="flabel">Accent</span>
    <div class="swatches" role="group" aria-label="Accent colour">${Object.entries(ACCENTS).map(([k,a])=>`<button type="button" data-accent="${k}" aria-pressed="${t.accent===k}"><span class="c" style="background:${a[dark?"dark":"light"][0]}"></span>${a.name}</button>`).join("")}</div>
    <span class="note">Used for buttons, charts and highlights. Workout colours stay the same.</span>`;
}
function setThemeOpen(open){
  $("#themePanel").hidden=!open;$("#themeBtn").setAttribute("aria-expanded",open);
  if(open)renderThemePanel();
}
$("#themeBtn").addEventListener("click",()=>setThemeOpen($("#themePanel").hidden));
$("#themePanel").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const t=themeNow();
  if(b.dataset.mode)t.mode=b.dataset.mode;
  if(b.dataset.accent)t.accent=b.dataset.accent;
  S.settings.theme=t;applyTheme(t);renderThemePanel();queue("settings");
});
// composedPath: the button clicked may already be replaced by the redraw above, so ask where the click started
document.addEventListener("click",e=>{if(!$("#themePanel").hidden&&!e.composedPath().includes($(".theme-wrap")))setThemeOpen(false)});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#themePanel").hidden){setThemeOpen(false);$("#themeBtn").focus()}});
DARK_MQ.addEventListener("change",()=>{applyTheme(themeNow());if(!$("#themePanel").hidden)renderThemePanel()});

/* ---------- data: backups, export, import ---------- */
const REASON={auto:"Daily (automatic)",manual:"Made by you","before-restore":"Before a restore","before-import":"Before an import"};
const D={backups:null,folder:"",msg:"",msgKind:"",confirm:null,importFile:null};
async function loadBackups(){
  try{const b=await api("/backups");D.backups=b.items;D.folder=b.folder}catch(e){D.backups=[];D.msg=`Couldn't list backups (${e.message}).`;D.msgKind="bad"}
  if(S.tab==="data")renderData();
}
function renderData(){
  if(D.backups===null){loadBackups()}
  const rows=(D.backups||[]).map(b=>`<tr><td class="num">${new Date(b.created_at).toLocaleString("en-GB",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})}</td>
    <td>${REASON[b.reason]||b.reason}</td><td class="r num">${(b.size/1024).toFixed(0)} KB</td>
    <td class="r">${D.confirm===b.name?`<span class="confirm"><span>Replace your log with this backup?</span><button class="btn danger small" data-act="restore-yes" data-name="${esc(b.name)}">Restore</button><button class="btn ghost small" data-act="cancel">Cancel</button></span>`
      :`<button class="btn ghost small" data-act="restore" data-name="${esc(b.name)}">Restore…</button>`}</td></tr>`).join("");
  $("#p-data").innerHTML=`
    ${D.msg?`<div class="card msg ${D.msgKind}" role="status">${esc(D.msg)}</div>`:""}
    <div class="card" style="display:grid;gap:10px">
      <h3>Where your log is saved</h3>
      <div class="path" id="dataPath">${esc(S.dataFolder||"…")}</div>
      <p class="note" style="margin:0">Everything you log is saved in a database (<span class="num">db.sqlite3</span>) in this folder on this computer. Rep Book backs it up there every day and keeps the last 30 backups. To keep a copy somewhere else, export it below and save the file to Google Drive, OneDrive or a USB stick.</p>
    </div>
    ${stravaCard()}
    <div class="card" style="display:grid;gap:12px">
      <div class="card-head" style="margin:0"><h3>Backups</h3><button class="btn" data-act="backup">Back up now</button></div>
      ${D.backups===null?`<p class="note">Loading backups…</p>`:rows?`<div class="tablewrap"><table><thead><tr><th>Made</th><th>Why</th><th class="r">Size</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
        :`<div class="empty">No backups yet. The first daily backup is made shortly after Rep Book starts.</div>`}
      <p class="note" style="margin:0">Restoring replaces everything in Rep Book with that backup. Rep Book backs up what you have now first, so you can undo it by restoring that one.</p>
    </div>
    <div class="card" style="display:grid;gap:12px">
      <h3>Export</h3>
      <div class="row">
        <a class="btn" href="/api/v1/export.json" download>Everything (.json)</a>
        <a class="btn ghost" href="/api/v1/export/sets.csv" download>Sets (.csv)</a>
        <a class="btn ghost" href="/api/v1/export/days.csv" download>Days and body weight (.csv)</a>
        ${S.acts.length?`<a class="btn ghost" href="/api/v1/export/activities.csv" download>Strava activities (.csv)</a>`:""}
      </div>
      <p class="note" style="margin:0">The .json file can be imported back into Rep Book, on this computer or another one. The .csv files open in Excel or Google Sheets.</p>
    </div>
    <div class="card" style="display:grid;gap:12px">
      <h3>Import</h3>
      <div class="row"><input type="file" id="importFile" accept=".json,application/json" class="inp" style="width:auto;max-width:100%">
        ${D.importFile?`<span class="confirm"><span>Replace everything with ${esc(D.importFile.name)}?</span><button class="btn danger small" data-act="import-yes">Import</button><button class="btn ghost small" data-act="cancel">Cancel</button></span>`:""}</div>
      <p class="note" style="margin:0">Loads a Rep Book .json export. It replaces everything in Rep Book, and a backup is made first.</p>
    </div>
    <p class="note">Rep Book ${esc(S.version||"")}</p>`;
}
function stravaCard(){
  const st=S.strava||{},runs=S.acts.filter(isRun),last=runs[runs.length-1];
  const have=S.acts.length?`<b>${runs.length}</b> run${runs.length===1?"":"s"} imported${S.acts.length>runs.length?` (${S.acts.length} activities in all)`:""}${last?` · latest run ${fd(last.date,{day:"numeric",month:"short",year:"numeric"})}`:""} · last import ${fmtWhen(st.lastImport)}`
    :"No runs imported yet.";
  return `<div class="card" style="display:grid;gap:12px">
    <div class="card-head" style="margin:0"><h3>Runs from Strava</h3><span class="muted">free, from Strava's data export</span></div>
    <p style="margin:0">${have}</p>
    ${st.waiting?`<div class="row"><span>Found <b>${esc(st.waiting.name)}</b> in your Downloads (${fmtWhen(st.waiting.modified)}).</span><button class="btn" data-act="strava-dl">Import it</button></div>`:""}
    <div class="row"><input type="file" id="stravaFile" accept=".zip,.csv" class="inp" style="width:auto;max-width:100%" aria-label="Strava export (.zip or activities.csv)"></div>
    <ol class="steps">
      <li>On strava.com open Settings → My Account → <a href="https://www.strava.com/athlete/delete_your_account" target="_blank" rel="noopener">Download or Delete Your Account</a>, click <b>Get Started</b>, then <b>Request Your Archive</b>. That's all you need on that page: don't delete anything.</li>
      <li>Strava emails you a link to a .zip file. It can take a few hours.</li>
      <li>Download it. Rep Book spots it in your Downloads folder and offers to import it, or pick it above.</li>
    </ol>
    <p class="note" style="margin:0">Every export has your whole history; Rep Book adds the activities it doesn't have yet, so do this once a week. Runs show in the daily log, the week and year views and Progress. Rep Book reminds you when the last import is a week old.</p>
    ${S.acts.length?(D.confirm==="strava"?`<span class="confirm"><span>Remove every activity imported from Strava?</span><button class="btn danger small" data-act="strava-forget-yes">Remove</button><button class="btn ghost small" data-act="cancel">Cancel</button></span>`
      :`<div><button class="linkbtn" style="padding:0" data-act="strava-forget">Remove the Strava activities from Rep Book</button></div>`):""}
  </div>`;
}
// Import a Strava export: the one found in Downloads, or a file picked by hand. Adds, never removes.
async function stravaImport(file,fromNudge){
  let msg,kind="ok";
  setStatus("Importing from Strava…");
  try{
    let r;
    if(file){const f=new FormData();f.append("file",file);r=await api("/strava/import",{method:"POST",body:f})}
    else r=await api("/strava/import-downloads",{method:"POST",body:JSON.stringify({name:S.strava.waiting.name})});
    await load();
    msg=r.added?`Added ${r.added} new activit${r.added===1?"y":"ies"} from Strava`:"Nothing new in that export: every activity in it was already here";
    if(r.latestRun)msg+=`. Latest run: ${fd(r.latestRun,{weekday:"short",day:"numeric",month:"short"})}`;
    msg+=".";
  }catch(err){msg=`Couldn't import from Strava: ${err.message}`;kind="bad";setStatus("Saved on this computer","ok")}
  if(fromNudge)S.stravaMsg={text:msg,kind};else{D.msg=msg;D.msgKind=kind}
  renderNudge();if(S.tab==="data")renderData();
}
// The page may stay open all week: look in Downloads again when it comes back into view
async function refreshStrava(){try{S.strava=await api("/strava");renderNudge();if(S.tab==="data"&&!$("#p-data").contains(document.activeElement))renderData()}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!S.signedOut)refreshStrava()});
$("#nudge").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.goto){setTab(b.dataset.goto);return}
  if(b.dataset.act==="strava-dl"){b.disabled=true;stravaImport(null,true)}
  if(b.dataset.act==="nudge-close"){S.stravaMsg=null;renderNudge()}
  if(b.dataset.act==="nudge-hide"){S.nudgeHidden=true;renderNudge()}
});
$("#p-data").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-act]");if(!b)return;const act=b.dataset.act;
  if(act==="strava-dl"){b.disabled=true;stravaImport(null,false);return}
  if(act==="strava-forget"){D.confirm="strava";renderData();return}
  const done=(msg,kind)=>{D.msg=msg;D.msgKind=kind;D.confirm=null;D.importFile=null;loadBackups()};
  if(act==="cancel"){D.confirm=null;D.importFile=null;const f=$("#importFile");if(f)f.value="";renderData();return}
  if(act==="restore"){D.confirm=b.dataset.name;renderData();return}
  b.disabled=true;
  try{
    if(act==="backup"){await api("/backups",{method:"POST"});done("Backup made.","ok")}
    if(act==="strava-forget-yes"){await api("/strava",{method:"DELETE"});await load();done("Removed the Strava activities. Import an export again to bring them back.","ok")}
    if(act==="restore-yes"){const r=await api(`/backups/${encodeURIComponent(b.dataset.name)}/restore`,{method:"POST"});
      await load();done(`Restored. Your log as it was before is in the backup made just now (${r.backup}).`,"ok")}
    if(act==="import-yes"&&D.importFile){const fdat=new FormData();fdat.append("file",D.importFile);
      const r=await api("/import",{method:"POST",body:fdat});await load();
      done(`Imported ${r.days} day${r.days===1?"":"s"}. Your log as it was before is in a backup (${r.backup}).`,"ok")}
  }catch(err){done(`That didn't work: ${err.message}`,"bad")}
});
$("#p-data").addEventListener("change",e=>{
  if(e.target.id==="importFile"){D.importFile=e.target.files[0]||null;D.msg="";renderData()}
  if(e.target.id==="stravaFile"&&e.target.files[0])stravaImport(e.target.files[0],false);
});

let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(drawCharts,150)});
boot();
</script>
