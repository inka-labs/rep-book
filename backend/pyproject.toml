[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repbook"
version = "1.1.0"
description = "Rep Book: a workout log, run locally in the browser."
requires-python = ">=3.12"

[tool.hatch.build.targets.wheel]
packages = ["repbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
